# tm25.eu — TM-25 ray file viewer. Installed by scripts/deploy-site.sh.
#
# Static site in /var/www/tm25.eu/html (landing page, /viewer/, samples);
# /app/ is the eulumdat-rs editor, aliased from the iesna.eu deploy.
# The viewer bundle itself (Bevy WASM, ~27 MB, Brotli'd to ~5 MB) is the
# one iesna.eu deploys; /tm25/ is an alias onto that directory so both sites
# always run the same build. tm25-viewer.js there is a symlink the deploy
# script points at the newest hashed glue file, hence no long cache on it.
#
# Wildcard: any *.tm25.eu serves the same site (cert covers *.tm25.eu),
# the same shape as gldf-search.de, ready for per-manufacturer subdomains.

# === Apex + www ===
server {
    server_name tm25.eu www.tm25.eu;
    root /var/www/tm25.eu/html;
    index index.html;
    include snippets/error-pages.conf;

    # The eulumdat-rs editor (Leptos shell with the TM-25 viewer and the
    # virtual goniometer), the same build iesna.eu serves. All its asset
    # paths are relative, so it runs under /app/ unchanged, and being on
    # this origin it can take the ray set the viewer stashes in IndexedDB.
    location = /app { return 301 /app/; }
    location /app/ {
        alias /var/www/iesna.eu/html/;
        index index.html;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
    location = /tm25/tm25-viewer.js {
        alias /var/www/iesna.eu/html/tm25/tm25-viewer.js;
        add_header Cache-Control "no-cache";
    }
    location /tm25/ {
        alias /var/www/iesna.eu/html/tm25/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /sample/ {
        expires 7d;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
        try_files $uri =404;
    }
    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico)$ {
        expires 30d;
        try_files $uri =404;
    }
    # Pages are small and change with every deploy: never let a browser
    # keep a stale one (its buttons and bundle paths would be out of date).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/tm25.eu.access.log;
    error_log  /var/log/nginx/tm25.eu.error.log;

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/tm25.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tm25.eu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# === Subdomains: *.tm25.eu ===
server {
    server_name ~^(?<sub>(?!www$)[a-z0-9][a-z0-9-]*)\.tm25\.eu$;
    root /var/www/tm25.eu/html;
    index index.html;
    include snippets/error-pages.conf;

    # The eulumdat-rs editor (Leptos shell with the TM-25 viewer and the
    # virtual goniometer), the same build iesna.eu serves. All its asset
    # paths are relative, so it runs under /app/ unchanged, and being on
    # this origin it can take the ray set the viewer stashes in IndexedDB.
    location = /app { return 301 /app/; }
    location /app/ {
        alias /var/www/iesna.eu/html/;
        index index.html;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
    location = /tm25/tm25-viewer.js {
        alias /var/www/iesna.eu/html/tm25/tm25-viewer.js;
        add_header Cache-Control "no-cache";
    }
    location /tm25/ {
        alias /var/www/iesna.eu/html/tm25/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /sample/ {
        expires 7d;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }
    # Pages are small and change with every deploy: never let a browser
    # keep a stale one (its buttons and bundle paths would be out of date).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/tm25.eu.wildcard.access.log;
    error_log  /var/log/nginx/tm25.eu.wildcard.error.log;

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/tm25.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tm25.eu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# === HTTP → HTTPS ===
server {
    listen 80;
    listen [::]:80;
    server_name tm25.eu www.tm25.eu;
    return 301 https://$host$request_uri;
}
server {
    listen 80;
    listen [::]:80;
    server_name ~^[a-z0-9][a-z0-9-]*\.tm25\.eu$;
    return 301 https://$host$request_uri;
}
